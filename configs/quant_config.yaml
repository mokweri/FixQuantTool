fuse_conv_bn: {}

# Training steps (from the start of QAT) after which BatchNorm folding is
# frozen inside FusedConvBN. null = never auto-freeze (freeze explicitly).
freeze_bn_delay: 3000
quantize_layers:
  torch.nn.Conv2d: QuantizedConv2d
  torch.nn.Linear: QuantizedLinear
  torch.nn.MaxPool2d: QMaxPool2D
  torch.nn.AdaptiveAvgPool2d: QAdaptiveAvgPool2d

replacement_type: quant

replace_add: {}
input_stub: {}
output_stub:
  output:
    out: 8